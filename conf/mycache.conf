# mycache 服务端配置
port 6379
bind 0.0.0.0
io_threads 4
shard_count 8
tcp_backlog 511
max_connections 10000
log_level info
# log_file /var/log/mycache.log

# ---- AOF 持久化 ----
# appendonly yes
# appendfilename appendonly.aof
# appendfsync everysec   # always / everysec / no
# dir .                  # AOF 文件目录（空或 "." 表示当前目录）

# ---- RDB 持久化 (Week 6) ----
# dbfilename dump.rdb    # SAVE / BGSAVE 快照文件名（命令：SAVE、BGSAVE）

# ---- IO 引擎 (Week 6) ----
# io_engine posix        # posix / io_uring（io_uring 需先安装 liburing-dev）

# ---- 内存治理 (Week 5) ----
# maxmemory 200mb        # 内存上限（0 = 不限制；支持 kb/mb/gb 后缀）
# maxmemory_policy noeviction  # noeviction / allkeys-lru / allkeys-random / volatile-lru / volatile-random
# maxmemory_samples 5    # 每次淘汰时的采样数（近似 LRU）
